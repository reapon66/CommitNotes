map $http_x_forwarded_proto $client_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

# HSTS is only sent when the request reached the proxy over HTTPS (production behind Traefik).
map $client_proto $hsts {
  https "max-age=31536000; includeSubDomains";
  default "";
}

# Hashed build files never change; the page, the service worker and the manifest are always revalidated.
map $uri $cache_control {
  default "public, max-age=86400";
  ~^/api/ "";
  /healthz "";
  ~^/assets/ "public, max-age=31536000, immutable";
  /index.html "no-cache";
  /sw.js "no-cache";
  /manifest.webmanifest "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Outer cap only: the API enforces MAX_UPLOAD_MB (1-100, default 20) and the interface checks it before sending.
  client_max_body_size 101m;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security $hsts always;
  add_header Cache-Control $cache_control;
  error_page 413 = @too_large;
  location @too_large {
    default_type application/json;
    return 413 '{"error":"Arquivo acima do limite permitido"}';
  }
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_read_timeout 120s;
  }
  location = /healthz {
    proxy_pass http://api:8080/actuator/health;
  }
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
  }
  location ~* \.mjs$ {
    types { }
    default_type text/javascript;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}

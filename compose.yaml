services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commitnotes
      POSTGRES_USER: commitnotes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commitnotes -d commitnotes"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/commitnotes
      DB_USER: commitnotes
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8088}
      FILES_DIR: /data/files
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      VAPID_PUBLIC: ${VAPID_PUBLIC:-}
      VAPID_PRIVATE: ${VAPID_PRIVATE:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:no-reply@localhost}
    volumes:
      - files_data:/data/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  postgres_data:
  files_data:

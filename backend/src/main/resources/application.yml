spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commitnotes}
    username: ${DB_USER:commitnotes}
    password: ${DB_PASSWORD:commitnotes}
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
server:
  forward-headers-strategy: framework
app:
  origin: ${APP_ORIGIN:http://localhost:5173}
  files-dir: ${FILES_DIR:./data/files}
  max-upload-mb: ${MAX_UPLOAD_MB:20}
  mail-from: ${MAIL_FROM:no-reply@localhost}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  vapid-public: ${VAPID_PUBLIC:}
  vapid-private: ${VAPID_PRIVATE:}
  vapid-subject: ${VAPID_SUBJECT:mailto:no-reply@localhost}
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
